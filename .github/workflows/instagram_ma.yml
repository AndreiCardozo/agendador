name: Instagram Mundos Alternativoz (posts agendados)

on:
  schedule:
    - cron: "*/15 * * * *"     # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram_ma
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Posta o que chegou a hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_MA }}
          IG_ID: ${{ secrets.IG_ID_MA }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARQ: nuvem/fila_ig_ma.json
          TAG: ig-fila_ma
        run: python3 nuvem/postar_ig.py
